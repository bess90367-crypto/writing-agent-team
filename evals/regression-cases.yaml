cases:
  - id: concise-reply-no-retelling
    scenario: reply_email
    prompt: "對方已知道前情，只需要告訴他校內確認完成並請他確認草稿"
    must:
      - "state confirmed status"
      - "ask for confirmation"
    must_not:
      - "retell full history"
      - "invent additional follow-up"

  - id: student-hard-deadline
    scenario: student_notice
    prompt: "提醒學生最晚中午12點前補資料，逾時不受理"
    must:
      - "exact deadline"
      - "clear consequence"
    must_not:
      - "soften deadline into suggestion"

  - id: poster-limit-and-reservation-conditions
    scenario: short_public_copy
    prompt: "海報只有一行空間：系友禮限量350份、發完為止；完成活動報名者可保留至16:00，未報名者依現場剩餘數量發放。請精簡。"
    must:
      - "respect the one-line poster space constraint"
      - "retain the limited quantity and while-supplies-last condition"
      - "retain the registration condition and reservation cutoff"
      - "make the two eligibility paths understandable"
    must_not:
      - "drop behavior-changing details for brevity"
      - "imply everyone is guaranteed a gift"
      - "add internal administrative explanation"

  - id: faculty-familiar-tone
    scenario: internal_faculty
    prompt: "寫給熟悉老師確認一個人選"
    must:
      - "respectful"
      - "natural"
      - "clear ask"
    must_not:
      - "official-document diction"
      - "excessive ceremonial wording"

  - id: external-noncoercive
    scenario: external_coordination
    prompt: "詢問講師兩個日期哪天方便"
    must:
      - "ask availability"
      - "allow neither date to work"
    must_not:
      - "pressure recipient to comply"
      - "reveal unrelated speakers' schedules"

  - id: line-short-natural
    scenario: group_message
    prompt: "在LINE問同事明早10點能否續開會"
    must:
      - "brief context"
      - "specific time"
      - "direct question"
    must_not:
      - "email salutation"
      - "long formal closing"
      - "unrequested promise to arrange or follow up"

  - id: vendor-process-fact
    scenario: vendor_reply
    prompt: "廠商已給電子發票，說明收到貨後才依學校流程請款"
    must:
      - "acknowledge invoice"
      - "state payment sequence"
    must_not:
      - "accuse vendor"
      - "overexplain accounting policy"

  - id: no-invented-promise
    scenario: progress_update
    prompt: "回覆目前已確認事項"
    must_not:
      - "promise to report back unless requested"
      - "add unconfirmed next steps"

  - id: ask-purpose-before-inviting-students
    scenario: event_coordination
    prompt: "對方問學生會不會到場，先問學生到場要做什麼"
    must:
      - "show willingness to ask students"
      - "ask what students need to understand or participate in"
    must_not:
      - "assume students must speak"
      - "sound resistant"

  - id: official-language-only-when-needed
    scenario: ordinary_email
    prompt: "一般行政信，非公文"
    must_not:
      - "use 來文/函復 style merely to sound formal"

  - id: complete-coordination-multiple-asks
    scenario: reply_email
    prompt: "同封信需請老師確認會議時間、參與人員及場地需求，三項都屬於同一安排"
    must:
      - "include all three necessary questions in one message"
      - "group related questions clearly"
      - "remain concise and natural"
    must_not:
      - "arbitrarily keep only one question"
      - "split necessary questions into avoidable follow-up emails"
      - "add unrelated requests or invented commitments"

  - id: preserve-existing-draft-minimal-edit
    scenario: editing_existing_draft
    prompt: "使用者提供一封已經清楚完整的信，僅要求修順一個語氣不自然的句子"
    must:
      - "preserve the original facts, structure, and intended tone"
      - "change only what is necessary for clarity or tone"
    must_not:
      - "rewrite well-written sections just to show changes"
      - "add commitments or facts not supplied by the user"

  - id: multiple-options-different
    scenario: alternatives
    prompt: "提供5版問法"
    must:
      - "variants differ in structure or tone"
    must_not:
      - "only synonym swaps"

  - id: donation-designation-not-yet-confirmed
    scenario: donation_reply
    prompt: "已收到捐款單並掃描作為附件，但還不確定要指定哪個基金。請回信詢問承辦確認。"
    must:
      - "acknowledge receipt and the user-confirmed scanned attachment"
      - "ask to confirm the intended fund rather than assert it"
      - "keep the reply concise and collegial"
    must_not:
      - "treat an unconfirmed fund designation as verified"
      - "claim payment or receipt issuance has been completed"
      - "invent a follow-up commitment"

  - id: internal-date-screening-before-poll
    scenario: group_message
    prompt: "先在系辦LINE工作群確認慶功宴投票是否以11/19至11/30為範圍、是否還有其他日期要避開；我11/27有公差，希望排除當天。請擬群組訊息。"
    must:
      - "ask whether the proposed range is suitable and whether other dates should be avoided"
      - "state the known unavailable date as an exclusion"
      - "keep the internal LINE message concise and conversational"
    must_not:
      - "treat the known unavailable date as an available poll option"
      - "assume the wider poll is already approved or launched"
      - "invent other scheduling constraints"

  - id: insurance-claim-spreadsheet-aggregation
    scenario: internship_reimbursement_email
    prompt: "使用者描述：學生提供的保費請款Excel把費用分到各實習學生名下，但學校請款範例只需要保費總金額。這次沒有附上Excel或範例檔。本次只需要更正請款格式，不涉及確認墊付或退款對象。請根據使用者描述，以自然精簡的語氣請學生將逐人拆分改成總金額；不要推測金額或付款人，也不要聲稱已核對檔案。"
    must:
      - "base the correction on the user-described workbook/example difference when files are not available"
      - "clearly request changing the per-student breakdown into one total amount for the school claim"
      - "keep the email concise and student-friendly"
    must_not:
      - "reverse the correction and request a per-student breakdown"
      - "add an unrelated question about who advanced payment in a format-only correction"
      - "invent a premium total, payer, or reimbursement status"
      - "claim the spreadsheet was verified when it was not inspected"

  - id: insurance-claim-aggregation-with-explicit-payer-check
    scenario: internship_reimbursement_email
    prompt: "使用者要寫信給學生：保費請款表不應把每人234元分別列入20位學生的金額欄，學校只需要總額4,680元（20×234），填在第一筆、其餘金額欄留白；使用者也明確要求同封信確認目前保費由誰先墊付。本測試僅提供上述文字，未附Excel。請用自然精簡的語氣擬信。"
    must:
      - "ask the student to replace the individual premium entries with the aggregate total in the required location, leaving other amount cells blank"
      - "preserve the provided total of 4,680 without inventing other amounts"
      - "also ask who advanced the premium payment, because the user explicitly requested it"
      - "combine both requested actions in one concise, student-friendly email"
    must_not:
      - "omit the explicit payer question by misclassifying the whole request as format-only"
      - "infer the payer or reimbursement recipient"
      - "reverse the direction and ask for per-student amounts"
      - "claim the workbook was inspected when no attachment was supplied"
      - "invent a refund or follow-up commitment"

  - id: traditional-chinese-name-list-word-paste
    scenario: image_transcription_output_format
    prompt: "純文字測試（沒有附圖片）：以下三個姓名已由人工核對，依序為「張儷瑄、鄭昕予、黃筱寧」。使用者要貼到 Word 表格，每人一格，請輸出可直接貼上的直行名單。不要自行校正或改寫姓名。"
    must:
      - "preserve the three supplied names exactly, character by character and in the original order"
      - "put one name on each line, suitable for pasting into separate Word table cells"
    must_not:
      - "replace uncommon or similar-looking Traditional Chinese characters with more familiar ones"
      - "add bullets, numbering, commentary, or extra separators to the name list"
      - "claim to have inspected an image that was not supplied"

  - id: hospital-first-contact-conditional-coordination
    scenario: hospital_internship_email
    prompt: "學生已錄取某醫院分院實習，第一次聯繫該院教學行政窗口。學校公文系統沒有該分院資料，需要確認公文正本受文單位、院區郵寄地址，以及是否須副本給學生實習科別或其他單位；之前與同體系其他院區有多年期實習合約，但不確定是否適用；若需新約，希望先取得電子檔辦理校內用印。已知學生實習前可能涉及體檢、保險證明等資料，尚不確定院方要求哪些、哪些可隨公文檢附或需另外繳交。請擬一封簡潔且一次問清楚的信。"
    must:
      - "ask for the exact 正本 recipient and branch mailing address needed for dispatch"
      - "ask whether the internship department or another unit should receive a 副本"
      - "ask whether an existing multi-year agreement covers this placement without assuming it does"
      - "conditionally ask for an electronic agreement copy if a new agreement is required"
      - "use the known health-exam and insurance categories to ask what the student must submit before placement, and which documents can accompany the official letter versus be submitted separately"
      - "combine related setup questions into one concise, courteous email"
    must_not:
      - "assume another hospital branch follows the same process"
      - "state that the existing agreement definitely applies"
      - "demand a new agreement before its necessity is confirmed"
      - "invent confirmed attachment requirements, deadlines, or procedures"
      - "replace concrete pre-placement and official-letter attachment questions with a vague generic request"

  - id: hospital-official-letter-reissue-confirm-before-dispatch
    scenario: hospital_official_letter_reissue_email
    prompt: "醫院說先前公文的附件遺失，請學校補發。校內已確認原公文投遞成功，但使用者沒有提供原發日期或文號。使用者要寫信請學生先將草擬補發公文內容轉給院方確認是否還需補充；院方確認無問題後才發文。請擬簡潔自然的學生回信。"
    must:
      - "briefly state the school has confirmed the reissue handling and present the proposed draft for hospital review"
      - "ask the student to forward the draft to the hospital and confirm any additional required content in one pass"
      - "make dispatch conditional on hospital confirmation"
      - "distinguish original delivery success from the hospital's reported missing attachment"
    must_not:
      - "invent the original dispatch date, document number, attachment checklist, or evidence"
      - "suggest the original letter was never delivered"
      - "blame the hospital for losing an attachment"
      - "claim the reissued letter has already been sent"
      - "overexplain the school's internal back-and-forth"

  - id: external-speaker-date-change-apology-tone
    scenario: external_speaker_rescheduling_email
    prompt: "已合作多次的學姐原訂12/10（四）11:00–13:00擔任職涯分享講師。今天收到校內通知，因本學期經費關帳較早，需改至11/25（三）或11/26（四），時間同為11:00–13:00；若兩日皆不便可再討論。使用者想知道是否需要道歉，並要求整封信語氣前後自然一致、不要太官腔。請提供一封可寄出的信。"
    must:
      - "briefly explain the school-side reason for changing the agreed date"
      - "present both alternative dates with their shared time accurately"
      - "ask which date works and allow neither to work"
      - "use a consistent, natural, respectful tone throughout"
      - "if acknowledging inconvenience or apologizing, keep it brief and proportional to the change"
    must_not:
      - "sound as though the speaker caused the schedule change"
      - "mix excessively formal apologies with abrupt or commanding requests"
      - "invent a confirmed replacement date or promise the event can definitely proceed on another date"
      - "overexplain internal accounting details"

  - id: external-visit-reply-natural-role-introduction
    scenario: external_visit_coordination_email
    prompt: "回覆高中端陳老師確認12/4（五）心理系參訪：使用者是中原心理系助教，負責高中端參訪聯繫；已借用科學館812，葉理豪老師可協助心理系簡介，另安排兩點覺閾與繆氏錯覺體驗及特色空間參觀；尚需確認對方預計抵達時間。使用者要求開頭簡單介紹自己，但不要生硬官腔。請擬簡潔自然的回信。"
    must:
      - "briefly identify the user as the psychology department assistant and relevant visit contact"
      - "introduce the role naturally without an inflated job-description formula"
      - "preserve the confirmed activities and room without inventing a detailed schedule"
      - "ask the visitor's expected arrival time clearly"
    must_not:
      - "use stiff phrasing such as 主要負責高中生參訪及相關聯繫事宜"
      - "omit the self-introduction when explicitly requested"
      - "invent a confirmed arrival time or additional arrangements"

  - id: external-partner-honorarium-payee-flexibility
    scenario: external_honorarium_email
    prompt: "要寫給長期合作的兩間基金會主任：本學期學校核給每間基金會講員費2,000元，作為對長期支持的感謝。附件暫按每間兩位人員各1,000元填寫，請主任確認合適人選及黃底資料後回傳；若希望同一人領取全部2,000元，回信告知即可調整。請用自然精簡的語氣擬信。"
    must:
      - "thank the partners naturally without excessive ceremony"
      - "preserve the amount per partner and provisional two-payee allocation"
      - "offer a single-payee full-amount alternative without deciding for the partner"
      - "ask to confirm highlighted details and return the attachment"
      - "keep the message compact and easy to read"
    must_not:
      - "assume the provisional payees are final"
      - "invent recipient identities, eligibility rules, or accounting requirements"
      - "overexplain internal reimbursement workflow"

  - id: compact-admin-email-with-complete-asks
    scenario: administrative_email_style
    prompt: "寫一封簡短行政信給合作單位：已完成表單初稿，請對方確認黃底資料並回傳；如需改由同一人領取講員費，請一併告知。使用者不喜歡每句話都獨立成段，但希望事情一次說清楚。"
    must:
      - "use cohesive paragraphs rather than a separate paragraph for each sentence"
      - "retain both the highlighted-field confirmation and conditional payee-change request"
      - "use natural, concise, respectful language"
    must_not:
      - "drop necessary actions merely to shorten the email"
      - "force an exact paragraph count when content does not warrant it"
      - "add unrequested accounting explanations or follow-up promises"

  - id: targeted-faculty-training-reminder-with-forwarded-notice
    scenario: faculty_compliance_reminder_email
    prompt: "資訊處來信提醒全校資安教育訓練符合率須達100%，並附課程建議及修課指引。使用者已在系統確認尚未完成指定項目的老師，現在只寄給這些老師，請他們在本週五11/13下班前完成『年度通識課程』。使用者另外提供選課建議，要整合進信件，最後以『其餘詳情請參考以下資訊處來信』引出原始通知。請寫自然精簡的提醒信；未提供的選課建議內容不可自行杜撰。"
    must:
      - "state the specific 年度通識課程 item and 11/13 before-close-of-business deadline prominently"
      - "make clear this is directed to recipients identified as still needing the item"
      - "place supplied practical guidance before a clearly introduced original Information Office notice"
      - "preserve the distinction between the department's targeted reminder and institution-wide security-training guidance"
    must_not:
      - "claim all teachers are incomplete"
      - "invent missing course guidance, URLs, penalties, or verified completion details"
      - "replace the specific course with a vague request to complete all training"
      - "bury the deadline in a lengthy verbatim forward"
